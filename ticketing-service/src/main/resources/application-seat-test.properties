# Local seat validation only. Activate explicitly; production defaults remain in application.properties.
ticketing.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false

ticketing.fan-score.sync.enabled=false
ticketing.reconciliation.scheduling.enabled=false
ticketing.external-clients.enabled=false

# These placeholders are never sent: external client methods fail before HTTP calls.
user-auth.internal-api.token=seat-test-disabled
concert.internal-api.token=seat-test-disabled

# Public test-only credentials. Never use this profile for a deployed service.
jwt.secret=${JWT_SECRET:seat-test-only-jwt-secret-at-least-32-bytes}
ticketing.internal-api.token=${TICKETING_INTERNAL_API_TOKEN:seat-test-only-internal-token}

# DB/Redis remain real dependencies. Compose injects only test connections.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/seat_test?currentSchema=ticketing,concert,queue,auth,public}
spring.datasource.username=${DB_USER:seat_test}
spring.datasource.password=${DB_PASSWORD:seat-test-only-db-password}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}

# Issue #3 supplies the schema and shared fixture. Do not create them through Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
