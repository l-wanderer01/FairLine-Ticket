name: fairline-seat-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: seat_test
      POSTGRES_USER: ${SEAT_TEST_DB_USER:-seat_test}
      POSTGRES_PASSWORD: ${SEAT_TEST_DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${SEAT_TEST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Fresh volumes execute 01-schema.sql then 02-fixture.sql.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SEAT_TEST_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ticketing-service:
    build:
      context: ../..
      dockerfile: ticketing-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: seat-test
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/seat_test?currentSchema=ticketing,concert,queue,auth,public
      DB_USER: ${SEAT_TEST_DB_USER:-seat_test}
      DB_PASSWORD: ${SEAT_TEST_DB_PASSWORD:?Copy .env.example to .env first}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${SEAT_TEST_JWT_SECRET:?Set a test-only JWT secret of at least 32 bytes}
      TICKETING_INTERNAL_API_TOKEN: ${SEAT_TEST_INTERNAL_API_TOKEN:?Set a test-only internal token}
      USER_AUTH_INTERNAL_API_TOKEN: seat-test-disabled
      CONCERT_INTERNAL_API_TOKEN: seat-test-disabled
    ports:
      - "127.0.0.1:${SEAT_TEST_TICKETING_PORT:-28084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Temurin has bash/grep; do not require curl or add another service.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

volumes:
  postgres-data:
  redis-data:
